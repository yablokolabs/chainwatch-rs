services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chainwatch
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      CHAINWATCH_DB_USER: chainwatch_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chainwatch"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  chainwatch:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      CHAINWATCH__DATABASE__URL: postgres://chainwatch_app@postgres:5432/chainwatch
      CHAINWATCH__REDIS__URL: redis://redis:6379/0
      CHAINWATCH__API__BIND_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
